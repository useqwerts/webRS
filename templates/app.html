<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Interface SPA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1e2e 0%, #2a2e3e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      padding-bottom: 80px;
      overflow-x: hidden;
    }

    /* Navigation */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      height: 70px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 1000;
    }

    nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 12px;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    nav a:hover {
      color: #00c6ff;
      transform: translateY(-2px);
    }

    nav a.active {
      color: #007aff;
      transform: scale(1.1);
    }

    nav a i {
      font-size: 22px;
      margin-bottom: 6px;
    }

    /* Pages */
    .page {
      display: none;
      padding: 20px;
      animation: slideIn 0.4s ease-out;
    }

    .page.active {
      display: block;
    }

    @keyframes slideIn {
      from { transform: translateX(20px); opacity: 0; }
      to   { transform: translateX(0); opacity: 1; }
    }

    /* Main Header */
    .main-header {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }

    .main-header .user-info {
      display: flex;
      align-items: center;
    }

    .main-header .user-info img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 12px;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease;
    }

    .main-header .user-info img:hover {
      transform: scale(1.05);
    }

    /* Search */
    .search {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .search input {
      background: none;
      border: none;
      color: #fff;
      width: 100%;
      font-size: 16px;
      padding: 8px;
    }

    .search input:focus-visible {
      outline: none;
    }

    /* Chat List */
    .chat-list .chat-item {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-list .chat-item:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .chat-list .chat-item i {
      font-size: 26px;
      margin-right: 12px;
      color: #00c6ff;
    }

    /* Chat UI */
    .chat-ui .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }

    .chat-ui .back {
      font-size: 18px;
      cursor: pointer;
      color: #00c6ff;
      transition: color 0.3s ease;
    }

    .chat-ui .back:hover {
      color: #007aff;
    }

.chat-ui .messages {
    margin-top: -18px;
    max-height: calc(100vh - 220px);
    overflow-y: auto;
    margin-bottom: 32px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px 0 0 12px; /* Flat right side */
    backdrop-filter: blur(8px);
}

    .chat-ui .messages::-webkit-scrollbar {
      width: 8px;
    }

    .chat-ui .messages::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .chat-ui .messages::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #007aff, #00c6ff);
      border-radius: 10px;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .chat-ui .messages::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #0060d0, #00bfff);
    }

    .chat-ui .no-messages {
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 40px;
    }

    .chat-ui .no-messages i {
      font-size: 50px;
      margin-bottom: 12px;
      color: #00c6ff;
    }

    .chat-ui .message {
      display: flex;
      flex-direction: column;
      margin: 12px 0;
      padding: 12px;
    }

    .chat-ui .message.user {
      align-items: flex-end;
    }

    .chat-ui .message.bot {
      align-items: flex-start;
    }

    .chat-ui .message-header {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }

    .chat-ui .avatar-container {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      margin-right: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .chat-ui .avatar-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .chat-ui .avatar-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #007aff, #00c6ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
    }

    .chat-ui .message-username {
      font-weight: 600;
      margin-right: 12px;
    }

    .chat-ui .message-timestamp {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
    }

    .chat-ui .message-content {
      background: rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 12px;
      max-width: 70%;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease;
    }

    .chat-ui .message.user .message-content {
      background: linear-gradient(145deg, #007aff, #00c6ff);
      color: #fff;
    }

    .chat-ui .message-content:hover {
      transform: scale(1.02);
    }

    .chat-ui .message-image {
      max-width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Custom Video Player */
    .chat-ui .custom-video-player {
      position: relative;
      max-width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chat-ui .video-element {
      width: 100%;
      display: block;
    }

    .chat-ui .controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px;
      display: flex;
      align-items: center;
      opacity: 1;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(8px);
    }

    .chat-ui .controls button {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      margin: 0 8px;
      font-size: 18px;
      transition: color 0.3s ease;
    }

    .chat-ui .controls button:hover {
      color: #00c6ff;
    }

    .chat-ui .progress-bar {
      flex-grow: 1;
      margin: 0 12px;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.2);
    }

    .chat-ui .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00c6ff;
      cursor: pointer;
    }

    .chat-ui .time {
      color: #fff;
      font-size: 12px;
      font-weight: 500;
    }

    /* Custom Audio Player */
    .custom-audio-player {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      max-width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .custom-audio-player:hover {
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transform: translateY(-2px);
    }

    .custom-play-btn {
      background: linear-gradient(145deg, #007aff, #00c6ff);
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .custom-play-btn:hover {
      background: linear-gradient(145deg, #0060d0, #00bfff);
      transform: scale(1.1);
    }

    .custom-play-btn:active {
      transform: scale(0.95);
    }

    .custom-audio-waves {
      flex: 1;
      position: relative;
      height: 8px;
      margin-right: 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .custom-audio-waves:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .custom-audio-waves .progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      border-radius: 6px;
      background: linear-gradient(to right, #007aff, #00c6ff);
      transition: width 0.2s linear;
    }

    .custom-time-display {
      flex-shrink: 0;
      font-weight: 500;
      font-size: 13px;
      color: #00c6ff;
      background: rgba(0, 122, 255, 0.15);
      padding: 4px 10px;
      border-radius: 10px;
      min-width: 48px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 122, 255, 0.2);
      transition: all 0.3s ease;
    }

    .custom-time-display:hover {
      background: rgba(0, 122, 255, 0.25);
      box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
    }

    .custom-filename {
      flex-shrink: 0;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Input Area */
    .chat-ui .input-area {
      position: fixed;
      bottom: 80px;
      left: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
    }

    .chat-ui .input-area input[type="text"] {
      background: none;
      border: none;
      color: #fff;
      flex-grow: 1;
      font-size: 16px;
      padding: 8px;
    }

    .chat-ui .input-area input[type="text"]:focus-visible {
      outline: none;
    }

    .chat-ui .input-area input[type="file"] {
      display: none;
    }

    .chat-ui .input-area label {
      cursor: pointer;
      color: #00c6ff;
      font-size: 22px;
      transition: color 0.3s ease;
    }

    .chat-ui .input-area label:hover {
      color: #007aff;
    }

    .chat-ui .input-area button {
      background: linear-gradient(145deg, #007aff, #00c6ff);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .chat-ui .input-area button:hover {
      background: linear-gradient(145deg, #0060d0, #00bfff);
      transform: scale(1.1);
    }

    .chat-ui .input-area button:active {
      transform: scale(0.95);
    }

    /* Loading Spinner */
    .chat-ui .lds-dual-ring {
      display: inline-block;
      width: 24px;
      height: 24px;
    }

    .chat-ui .lds-dual-ring:after {
      content: " ";
      display: block;
      width: 20px;
      height: 20px;
      margin: 2px;
      border-radius: 50%;
      border: 3px solid #00c6ff;
      border-color: #00c6ff transparent #00c6ff transparent;
      animation: lds-dual-ring 1.2s linear infinite;
    }

    @keyframes lds-dual-ring {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Error Message */
    .error-message {
      color: #ff4444;
      text-align: center;
      margin: 12px 0;
      background: rgba(255, 75, 75, 0.1);
      padding: 10px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      .chat-ui .input-area {
        bottom: 70px;
        left: 10px;
        right: 10px;
      }

      .chat-ui .messages {
        max-height: calc(100vh - 200px);
      }

      nav {
        height: 60px;
      }

      nav a i {
        font-size: 20px;
      }

      nav a {
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Main Section -->
  <div id="main" class="page active">
    <div class="main-header">
      <div class="user-info">
        <img id="avatar" src="" alt="Avatar" onerror="this.style.display='none'" aria-label="User Avatar">
        <span id="username">Guest</span>
      </div>
    </div>
  </div>

  <!-- Progress -->
  <div id="progress" class="page">
    <h1>Progress</h1>
    <p>Your progress overview.</p>
  </div>

  <!-- Today -->
  <div id="today" class="page">
    <h1>Today</h1>
    <p>Today's events and tasks.</p>
  </div>

  <!-- Chat List -->
  <div id="chat-list" class="page">
    <div class="search">
      <input type="text" placeholder="Search chats..." aria-label="Search chats">
    </div>
    <div class="chat-list">
      <div class="chat-item" data-chat="group-15890">
        <i class="fas fa-users"></i>
        <div>
          <strong>My Group - General</strong>
          <p>No message</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat UI -->
  <div id="chat-ui" class="page chat-ui">
    <div class="header">
      <i class="fas fa-arrow-left back" aria-label="Back to chat list"></i>
      <span class="title">Group General</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area" id="message-form">
      <label for="file-input"><i class="fas fa-paperclip" aria-label="Attach file"></i></label>
      <input type="file" id="file-input" accept="image/jpeg,image/jpg,image/gif,image/png,video/mp4,video/webm,video/ogg,audio/mpeg,audio/mp3" aria-label="File upload">
      <input type="text" id="message-input" placeholder="Type here..." aria-label="Type a message">
      <button type="submit" id="send-button" aria-label="Send message"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- Profile -->
  <div id="profile" class="page">
    <h1>Profile</h1>
    <p>User information.</p>
  </div>

  <!-- Navigation -->
  <nav>
    <a href="#" data-page="main" class="active" aria-label="Main page"><i class="fas fa-home"></i>Main</a>
    <a href="#" data-page="progress" aria-label="Progress page"><i class="fas fa-chart-line"></i>Progress</a>
    <a href="#" data-page="today" aria-label="Today page"><i class="fas fa-calendar"></i>Today</a>
    <a href="#" data-page="chat-list" aria-label="Chat list page"><i class="fas fa-comments"></i>Chat</a>
    <a href="#" data-page="profile" aria-label="Profile page"><i class="fas fa-user"></i>Profile</a>
  </nav>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script>
    const socket = io();
    const pages = document.querySelectorAll('.page');
    const navLinks = document.querySelectorAll('nav a');
    const chatItems = document.querySelectorAll('.chat-item');
    const backBtn = document.querySelector('.back');
    const avatar = document.getElementById('avatar');
    const messagesDiv = document.getElementById('messages');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    const fileInput = document.getElementById('file-input');
    const sendButton = document.getElementById('send-button');
    const currentUser = sessionStorage.getItem('username') || 'Guest';
    let currentChatId = null;

    // Show username and avatar
    document.getElementById('username').textContent = currentUser;
    fetch(`/get_avatar/${currentUser}`)
      .then(res => res.json())
      .then(data => {
        if (data.avatar_url) {
          avatar.src = data.avatar_url;
          avatar.style.display = 'block';
        }
      });

    // Handle connection errors
    socket.on('connect_error', (err) => {
      const errorDiv = document.createElement('div');
      errorDiv.classList.add('error-message');
      errorDiv.textContent = `Connection failed: ${err.message}. Please try again.`;
      messagesDiv.appendChild(errorDiv);
    });

    // Switch pages
    function showPage(id) {
      pages.forEach(p => p.classList.toggle('active', p.id === id));
      navLinks.forEach(a => a.classList.toggle('active', a.dataset.page === id));
      history.pushState(null, '', `/${id}`);
      if (id === 'chat-ui') scrollToBottom();
    }

    // Smooth scroll to bottom
    function scrollToBottom() {
      messagesDiv.scrollTo({ top: messagesDiv.scrollHeight, behavior: 'smooth' });
    }

    // Create custom video player
    function createCustomVideoPlayer(videoUrl) {
      const player = document.createElement('div');
      player.classList.add('custom-video-player');

      const video = document.createElement('video');
      video.classList.add('video-element');
      video.src = videoUrl;
      video.preload = 'metadata';

      const controls = document.createElement('div');
      controls.classList.add('controls');

      const playBtn = document.createElement('button');
      playBtn.innerHTML = '<i class="fas fa-play"></i>';
      playBtn.setAttribute('aria-label', 'Play/Pause video');

      const progressBar = document.createElement('input');
      progressBar.type = 'range';
      progressBar.classList.add('progress-bar');
      progressBar.value = 0;
      progressBar.setAttribute('aria-label', 'Video progress');

      const timeDisplay = document.createElement('span');
      timeDisplay.classList.add('time');
      timeDisplay.textContent = '00:00';

      controls.appendChild(playBtn);
      controls.appendChild(progressBar);
      controls.appendChild(timeDisplay);
      player.appendChild(video);
      player.appendChild(controls);

      let hideControlsTimeout;
      function resetControlsTimeout() {
        clearTimeout(hideControlsTimeout);
        controls.style.opacity = '1';
        hideControlsTimeout = setTimeout(() => {
          controls.style.opacity = '0';
        }, 3000);
      }

      player.addEventListener('mousemove', resetControlsTimeout);
      video.addEventListener('play', resetControlsTimeout);
      video.addEventListener('pause', resetControlsTimeout);

      playBtn.addEventListener('click', () => {
        if (video.paused) {
          video.play();
          playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        } else {
          video.pause();
          playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }
      });

      video.addEventListener('timeupdate', () => {
        const progress = (video.currentTime / video.duration) * 100;
        progressBar.value = progress;
        const minutes = Math.floor(video.currentTime / 60);
        const seconds = Math.floor(video.currentTime % 60);
        timeDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      });

      progressBar.addEventListener('input', () => {
        video.currentTime = (progressBar.value / 100) * video.duration;
      });

      return player;
    }

    // Create custom audio player
    function createCustomAudioPlayer(audioUrl, filename) {
      const player = document.createElement('div');
      player.classList.add('custom-audio-player');

      const audio = document.createElement('audio');
      audio.src = audioUrl;
      audio.preload = 'metadata';

      const maxLength = 20;
      const displayFilename = filename.length > maxLength ? filename.substring(0, maxLength - 3) + '...' : filename;

      const playBtn = document.createElement('button');
      playBtn.classList.add('custom-play-btn');
      playBtn.innerHTML = '<i class="fas fa-play"></i>';
      playBtn.setAttribute('aria-label', 'Play/Pause audio');

      const waves = document.createElement('div');
      waves.classList.add('custom-audio-waves');
      const progress = document.createElement('div');
      progress.classList.add('progress');
      waves.appendChild(progress);

      const timeDisplay = document.createElement('span');
      timeDisplay.classList.add('custom-time-display');
      timeDisplay.textContent = '00:00';

      const filenameDisplay = document.createElement('span');
      filenameDisplay.classList.add('custom-filename');
      filenameDisplay.textContent = displayFilename;

      player.appendChild(filenameDisplay);
      player.appendChild(playBtn);
      player.appendChild(waves);
      player.appendChild(timeDisplay);

      let hideControlsTimeout;
      function resetControlsTimeout() {
        clearTimeout(hideControlsTimeout);
        playBtn.style.opacity = '1';
        waves.style.opacity = '1';
        timeDisplay.style.opacity = '1';
        hideControlsTimeout = setTimeout(() => {
          playBtn.style.opacity = '0.7';
          waves.style.opacity = '0.7';
          timeDisplay.style.opacity = '0.7';
        }, 3000);
      }

      player.addEventListener('mousemove', resetControlsTimeout);
      audio.addEventListener('play', resetControlsTimeout);
      audio.addEventListener('pause', resetControlsTimeout);

      playBtn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play();
          playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        } else {
          audio.pause();
          playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }
      });

      audio.addEventListener('timeupdate', () => {
        const progressWidth = (audio.currentTime / audio.duration) * 100;
        progress.style.width = `${progressWidth}%`;
        const minutes = Math.floor(audio.currentTime / 60);
        const seconds = Math.floor(audio.currentTime % 60);
        timeDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      });

      return player;
    }

    // Create message element
    function createMessageElement(message) {
      const messageElement = document.createElement('div');
      messageElement.classList.add('message', message.username === currentUser ? 'user' : 'bot');

      const header = document.createElement('div');
      header.classList.add('message-header');

      const avatarContainer = document.createElement('div');
      avatarContainer.classList.add('avatar-container');

      const avatarPlaceholder = document.createElement('div');
      avatarPlaceholder.classList.add('avatar-placeholder');
      avatarPlaceholder.textContent = message.username.charAt(0).toUpperCase();
      avatarContainer.appendChild(avatarPlaceholder);

      fetch(`/get_avatar/${message.username}`)
        .then(res => res.json())
        .then(data => {
          avatarContainer.innerHTML = '';
          if (data.avatar_url) {
            const avatarImg = document.createElement('img');
            avatarImg.src = data.avatar_url;
            avatarImg.alt = message.username;
            avatarImg.classList.add('avatar-image');
            avatarContainer.appendChild(avatarImg);
          } else {
            avatarContainer.appendChild(avatarPlaceholder);
          }
        })
        .catch(() => {
          avatarContainer.innerHTML = '';
          avatarContainer.appendChild(avatarPlaceholder);
        });

      const usernameElement = document.createElement('span');
      usernameElement.classList.add('message-username');
      usernameElement.textContent = message.username;

      const timestampElement = document.createElement('span');
      timestampElement.classList.add('message-timestamp');
      timestampElement.textContent = message.timestamp || new Date().toLocaleTimeString();

      header.appendChild(avatarContainer);
      header.appendChild(usernameElement);
      header.appendChild(timestampElement);

      const content = document.createElement('div');
      content.classList.add('message-content');

      if (message.type === 'text') {
        content.textContent = message.text;
      } else if (message.type === 'file') {
        if (message.filename.match(/\.(jpeg|jpg|gif|png)$/i)) {
          const imageWrapper = document.createElement('div');
          const imgLoadingSpinner = document.createElement('div');
          imgLoadingSpinner.classList.add('lds-dual-ring');
          content.appendChild(imgLoadingSpinner);

          const image = document.createElement('img');
          image.src = message.url;
          image.alt = message.filename;
          image.classList.add('message-image');
          image.style.display = 'none';

          image.onload = () => {
            imgLoadingSpinner.style.display = 'none';
            image.style.display = 'block';
          };

          image.onerror = () => {
            imgLoadingSpinner.style.display = 'none';
            content.textContent = 'Error loading image';
          };

          imageWrapper.appendChild(image);
          content.appendChild(imageWrapper);
        } else if (message.filename.match(/\.(mp4|webm|ogg)$/i)) {
          const customPlayer = createCustomVideoPlayer(message.url);
          content.appendChild(customPlayer);
        } else if (message.filename.match(/\.(mp3|mpeg)$/i)) {
          const customPlayer = createCustomAudioPlayer(message.url, message.filename);
          content.appendChild(customPlayer);
        }
      }

      messageElement.appendChild(header);
      messageElement.appendChild(content);
      return messageElement;
    }

    // Load messages
    socket.on('load_messages', (loadedMessages) => {
      messagesDiv.innerHTML = '';
      if (loadedMessages.length === 0) {
        const noMessages = document.createElement('div');
        noMessages.classList.add('no-messages');
        noMessages.innerHTML = '<i class="fas fa-comments"></i><p>No Messages</p><p>Start chatting with groupmates</p>';
        messagesDiv.appendChild(noMessages);
      } else {
        loadedMessages.forEach(message => {
          messagesDiv.appendChild(createMessageElement(message));
        });
        scrollToBottom();
        const lastMessage = loadedMessages[loadedMessages.length - 1];
        updateChatItemPreview(currentChatId, lastMessage);
      }
    });

    // New message
    socket.on('new_message', (message) => {
      const noMessages = messagesDiv.querySelector('.no-messages');
      if (noMessages) noMessages.remove();
      messagesDiv.appendChild(createMessageElement(message));
      scrollToBottom();
      updateChatItemPreview(currentChatId, message);
    });

    // Debounce function
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // Send message
    function sendMessage() {
      const text = messageInput.value.trim();
      if (text) {
        socket.emit('send_message', { username: currentUser, text, type: 'text', chatId: currentChatId });
        messageInput.value = '';
      }
    }

    const debouncedSendMessage = debounce(sendMessage, 200);

    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      debouncedSendMessage();
    });

    sendButton.addEventListener('click', (e) => {
      e.preventDefault();
      debouncedSendMessage();
    });

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        debouncedSendMessage();
      }
    });

    // File upload
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      const validTypes = [
        'image/jpeg', 'image/jpg', 'image/gif', 'image/png',
        'video/mp4', 'video/webm', 'video/ogg',
        'audio/mpeg', 'audio/mp3'
      ];

      if (!validTypes.includes(file.type)) {
        const errorDiv = document.createElement('div');
        errorDiv.classList.add('error-message');
        errorDiv.textContent = 'Invalid file type. Please upload images, videos, or MP3 files.';
        messagesDiv.appendChild(errorDiv);
        fileInput.value = '';
        return;
      }

      const form = new FormData();
      form.append('file', file);

      fetch('/upload', {
        method: 'POST',
        body: form
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            fileInput.value = '';
          } else {
            throw new Error(data.error || 'Upload failed');
          }
        })
        .catch(err => {
          const errorDiv = document.createElement('div');
          errorDiv.classList.add('error-message');
          errorDiv.textContent = err.message;
          messagesDiv.appendChild(errorDiv);
        });
    });

    // Navigation
    navLinks.forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        showPage(link.dataset.page);
      });
    });

    chatItems.forEach(item => {
      item.addEventListener('click', () => {
        currentChatId = item.dataset.chat;
        showPage('chat-ui');
        socket.emit('load_messages', { chatId: currentChatId });
      });
    });

    backBtn.addEventListener('click', () => showPage('chat-list'));

    avatar.addEventListener('click', () => showPage('profile'));

    window.addEventListener('popstate', () => {
      const id = location.pathname.replace('/', '') || 'main';
      showPage(id);
    });

    // Update chat item preview
    function updateChatItemPreview(chatId, message) {
      const chatItem = document.querySelector(`.chat-item[data-chat="${chatId}"]`);
      if (chatItem) {
        const preview = chatItem.querySelector('p');
        if (message.type === 'text') {
          preview.textContent = message.text.length > 20 ? message.text.substring(0, 17) + '...' : message.text;
        } else if (message.type === 'file') {
          preview.textContent = message.filename.length > 20 ? message.filename.substring(0, 17) + '...' : message.filename;
        }
      }
    }
  </script>
</body>
</html>
